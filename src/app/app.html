
<mat-toolbar color="primary">
  My Blog
</mat-toolbar>

<div class="container">
  <div class="video-grid">
    <mat-card *ngFor="let post of blogPosts" class="video-card">
      <img mat-card-image [src]="post.image" alt="Thumbnail" />
      <mat-card-content>
        <h3 class="video-title">{{ post.title }}</h3>
        <p class="video-channel">{{ post.channel }}</p>
        <p class="video-stats">{{ post.views }} views • {{ post.date }}</p>
      </mat-card-content>
    </mat-card>
  </div>
</div>
